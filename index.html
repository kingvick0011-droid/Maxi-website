<!DOCTYPE html>
<html>
<head>

        .box { background: white; max-width: 400px; margin: auto; padding: 40px; border-radius: 16px; }

        .btn-white { display: block; background: white; color: #1a73e8; border: 2px solid #1a73e8; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>✨ MAXI ✨</h1>
        <p>Welcome to your trusted platform</p>
        <a href="#" class="btn-blue">Create Account</a>

</html>
